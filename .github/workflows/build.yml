name: Build KySoPDF Setup (Windows 7 compatible)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Kiem tra index.html
        shell: pwsh
        run: |
          if (-not (Test-Path index.html)) { Write-Error "Thieu index.html - hay tai file nay len repo (lay tu _internal cua ban cu)"; exit 1 }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          architecture: x64

      - name: Cai thu vien
        shell: pwsh
        run: |
          python -m pip install --upgrade pip "setuptools<70" wheel "cython<3"
          python -m pip install python-pkcs11==0.7.0 --no-build-isolation
          python -m pip install -r requirements.txt

      - name: Build exe
        shell: cmd
        run: |
          python -m PyInstaller --noconfirm --onedir --windowed --name KySoPDF --collect-all pyhanko --collect-all pyhanko_certvalidator --collect-all pkcs11 --collect-all certifi --hidden-import pkcs11._pkcs11 agent.py
          copy /Y config.json dist\KySoPDF\config.json
          copy /Y index.html dist\KySoPDF\index.html

      - name: Tao bo cai
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: KySoPDF-Setup
          path: Output/KySoPDF-Setup.exe
